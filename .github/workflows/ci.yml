name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job rather than a step in `build`: linting is OS-independent and
  # takes seconds, so running it in parallel reports style problems without
  # waiting on the two-platform build matrix.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The project is developed on Windows and deployed from Linux, so both
        # matter: path handling and line endings differ between them.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm's version is pinned by the "packageManager" field, so let corepack
      # resolve it rather than hardcoding it again here.
      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Deliberately before `pnpm build`: the Pages workflow builds the app
      # from a fresh checkout with no packages/*/dist, so running it here in
      # the same state is what catches a stale alias or path mapping. Running
      # it after `tsc -b` would resolve through dist and hide the problem.
      - name: Build web app (no prior tsc -b, as Pages does it)
        run: pnpm build:web

      - name: Build
        run: pnpm build

      # Bundled before the tests so the extension's bundle smoke test — which
      # loads the real .cjs with a stubbed `vscode` module — actually runs
      # rather than skipping.
      - name: Build VS Code extension
        run: pnpm build:vscode

      - name: Test
        run: pnpm test

      - name: Package VS Code extension
        run: pnpm package:vscode

      - name: Upload VSIX
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: devbridge-vsix
          path: apps/vscode/devbridge.vsix
          if-no-files-found: error

  verify-generated:
    name: compile generated output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # --strict turns a missing toolchain into a failure: in CI every one of
      # them is installed above, so a skip would mean the setup silently broke.
      - name: Compile generated output with real toolchains
        run: pnpm verify:generated:strict
