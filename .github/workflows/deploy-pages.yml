name: Deploy web app to Pages

on:
  push:
    branches: [main]
    # Only rebuild when something that ends up in the bundle changed.
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer commit supersede an in-flight run
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build web app
        # configure-pages reports the base path for this repository, so the
        # site keeps working whether it is served from /devbridge/ or a root
        # custom domain.
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build:web

      - name: SPA fallback
        # Pages serves 404.html for unknown paths; making it a copy of
        # index.html means a deep link still loads the app.
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
