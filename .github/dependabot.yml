version: 2

updates:
  # One ecosystem entry covers the whole pnpm workspace: dependabot reads the
  # root lockfile, which is where every package's version is actually pinned.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The tooling moves together and is exercised by every CI run, so one PR
      # per week is enough; a broken bump shows up as a red build immediately.
      dev-tooling:
        patterns:
          - "typescript"
          - "vitest"
          - "oxlint"
          - "vite"
          - "@types/*"
          - "@vitejs/*"
          - "@vscode/*"
        update-types:
          - minor
          - patch
      # esbuild is deliberately NOT in that group. It is pre-1.0, where a
      # minor IS the breaking release — dependabot classified 0.25 -> 0.28 as
      # "minor" and grouped it with patch bumps, which is exactly the kind of
      # change that should arrive on its own and be looked at.
    ignore:
      # TypeScript 7 is a hard floor: the native port is what the repo targets,
      # and typescript-eslint does not support it (which is why oxlint is here).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node's major tracks a Node major, and CI runs Node 24. Types
      # ahead of the runtime typecheck calls to APIs that are not there at
      # run time, which is worse than being a version behind. Bump this
      # deliberately, together with the `node-version` in both workflows.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
